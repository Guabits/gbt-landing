<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0B0E14" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'daybook' : 'nightbook');
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-100 text-base-content antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
